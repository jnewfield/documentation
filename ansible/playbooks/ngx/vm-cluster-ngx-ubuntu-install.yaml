---
- name: Update all nodes install vim, net-tools, disable swap & firewall, install docker helper packages
  hosts: testenv
  vars_files:
    - /tmp/testenvansiblevars
  tasks:
    - name: Disable swap and firewall
      shell: |
        sudo swapoff -a
        sudo sed -i '/swap/ s/^/#/' /etc/fstab
        sudo ufw disable
      args:
        executable: /bin/bash
    - name: Install vim, net-tools, curl, gnupg, apt-transport-https, lsb-release, ca-certificates and dirmngr
      become: yes
      apt:
        pkg:
          - vim
          - net-tools
          - curl
          - gnupg
          - apt-transport-https
          - lsb-release
          - ca-certificates
          - dirmngr
        update-cache: yes
    - name: Create nginx directory (for nginx.repo cert)
      command: sudo mkdir -p /etc/ssl/nginx
    - name: Copy nginx.repo.crt to /etc/ssl/nginx/
      become: yes
      copy:
        src: ~/Documents/NGINX/NGINX-Trials/NGINXPlus/ValidCert/nginx-repo.crt
        dest: /etc/ssl/nginx/nginx-repo.crt
    - name: Copy nginx.repo.key to /etc/ssl/nginx/
      become: yes
      copy:
        src: ~/Documents/NGINX/NGINX-Trials/NGINXPlus/ValidCert/nginx-repo.key
        dest: /etc/ssl/nginx/nginx-repo.key
    - name: Download nginx and app protect keys
      shell: | 
        sudo wget https://cs.nginx.com/static/keys/nginx_signing.key && sudo apt-key add nginx_signing.key
        sudo wget https://cs.nginx.com/static/keys/app-protect-security-updates.key && sudo apt-key add app-protect-security-updates.key
    - name: Update sources lists for nginx-plus, app-protect and modsecurity
      shell: |
        printf "deb https://pkgs.nginx.com/plus/ubuntu `lsb_release -cs` nginx-plus\n" | sudo tee /etc/apt/sources.list.d/nginx-plus.list
        printf "deb https://pkgs.nginx.com/app-protect/ubuntu `lsb_release -cs` nginx-plus\n" | sudo tee /etc/apt/sources.list.d/nginx-app-protect.list
        printf "deb https://pkgs.nginx.com/app-protect-security-updates/ubuntu `lsb_release -cs` nginx-plus\n" | sudo tee -a /etc/apt/sources.list.d/nginx-app-protect.list
        printf "deb https://pkgs.nginx.com/modsecurity/ubuntu `lsb_release -cs` nginx-plus\n" | sudo tee /etc/apt/sources.list.d/nginx-modsecurity.list
        sudo wget -P /etc/apt/apt.conf.d https://cs.nginx.com/static/files/90pkgs-nginx
    - name: Install nginx-plus, app-protect and modsecurity module
      become: yes
      apt: 
        pkg:
          - nginx-plus
          - app-protect
          - app-protect-attack-signatures
          - nginx-plus-module-modsecurity
        update-cache: yes
    - name: Get state of /etc/nginx/conf.d/default.conf
      stat: path=/etc/nginx/conf.d/default.conf
      register: ngx_default_conf
    - name: Rename /etc/nginx/conf.d/default.conf to remove it from nginx processing
      command: sudo mv /etc/nginx/conf.d/default.conf /etc/nginx/conf.d/default.conf.bak
      when: ngx_default_conf.stat.exists
    - name: Copy beverages.conf to /etc/nginx/conf.d/
      become: yes
      copy:
        src: beverages.conf
        dest: /etc/nginx/conf.d/
    - name: Copy main_nginx.conf to /etc/nginx/conf.d/
      become: yes
      copy:
        src: main_nginx.conf
        dest: /etc/nginx/conf.d/
    - name: Enable nginx
      command: sudo nginx
